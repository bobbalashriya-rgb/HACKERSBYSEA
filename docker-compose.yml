services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finlytics-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WISPRFLOW_URL=http://wisprflow:8002
    depends_on:
      - wisprflow
    restart: unless-stopped

  wisprflow:
    build:
      context: ./wisprflow
      dockerfile: Dockerfile
    container_name: finlytics-wisprflow
    ports:
      - "8002:8002"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finlytics-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

