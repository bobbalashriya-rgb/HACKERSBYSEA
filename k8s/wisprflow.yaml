apiVersion: apps/v1
kind: Deployment
metadata:
  name: wisprflow-deployment
  namespace: finlytics
  labels:
    app: finlytics-wisprflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finlytics-wisprflow
  template:
    metadata:
      labels:
        app: finlytics-wisprflow
    spec:
      containers:
      - name: wisprflow
        # Replace <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com with your AWS ECR URI
        image: finlytics-wisprflow:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8002
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: 8002
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 8002
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: wisprflow-service
  namespace: finlytics
  labels:
    app: finlytics-wisprflow
spec:
  type: ClusterIP
  ports:
  - port: 8002
    targetPort: 8002
    protocol: TCP
    name: http
  selector:
    app: finlytics-wisprflow
