apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: finlytics
  labels:
    app: finlytics-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: finlytics-backend
  template:
    metadata:
      labels:
        app: finlytics-backend
    spec:
      containers:
      - name: backend
        # Replace <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com with your AWS ECR URI
        image: finlytics-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: finlytics-config
        - secretRef:
            name: finlytics-secrets
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: finlytics
  labels:
    app: finlytics-backend
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: finlytics-backend

