apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: finlytics
  labels:
    app: finlytics-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: finlytics-frontend
  template:
    metadata:
      labels:
        app: finlytics-frontend
    spec:
      containers:
      - name: frontend
        # Replace <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com with your AWS ECR URI
        image: finlytics-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: finlytics
  labels:
    app: finlytics-frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: finlytics-frontend
